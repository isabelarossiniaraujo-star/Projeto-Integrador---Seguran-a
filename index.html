<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Dados</title>
    <style>
* {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f9;
            color: #222;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #1e293b;
            color: #ffffff;
            padding: 20px;
            text-align: center;
        }

        main {
            flex: 1;
            width: 100%;
            max-width: 720px;
            margin: 30px auto;
            padding: 0 16px;
        }

        section {
            background-color: #ffffff;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 24px;
        }

        h2 {
            margin-bottom: 16px;
            font-size: 1.25rem;
            color: #0f172a;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .campo {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-weight: bold;
            font-size: 0.95rem;
        }

        input,
        select {
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
            background-color: #fff;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            padding: 12px 18px;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        #mural-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 14px;
        }

        .card {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-left: 4px solid #2563eb;
            border-radius: 6px;
            padding: 14px;
        }

        .card h3 {
            font-size: 1rem;
            margin-bottom: 8px;
            color: #0f172a;
        }

        .card p {
            font-size: 0.92rem;
            margin-bottom: 4px;
        }

        footer {
            background-color: #1e293b;
            color: #cbd5e1;
            text-align: center;
            padding: 16px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Título / Logo do Projeto</h1>
    </header>

    <main>
        <section>
            <h2>Formulário de Entrada</h2>
            <form id="form-registro">
                <div class="campo">
                    <label for="nome">Campo Nome</label>
                    <input type="text" id="nome" placeholder="Digite o nome" required>
                </div>

                <div class="campo">
                    <label for="categoria">Seleção Categoria</label>
                    <select id="categoria" required>
                        <option value="">Selecione uma categoria...</option>
                        <option value="Categoria 1">Categoria 1</option>
                        <option value="Categoria 2">Categoria 2</option>
                        <option value="Categoria 3">Categoria 3</option>
                    </select>
                </div>

                <button type="submit">Salvar Registro</button>
            </form>
        </section>

        <section>
            <h2>Mural de Cards</h2>
            <div id="mural-cards"></div>
        </section>
    </main>

    <footer>
        <p>Desenvolvido pela equipe - Dia 1</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
